<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <!-- Header -->
      <div class="header">
        <h1>Tic-Tac-Toe</h1>
        <p class="subtitle">HTML5 · CSS3 · JavaScript</p>
      </div>

      <!-- Mode selector -->
      <div class="mode-row">
        <button class="mode-btn active" id="btn-pvp" onclick="setMode('pvp')">
          👥 2 Players
        </button>
        <button class="mode-btn" id="btn-ai" onclick="setMode('ai')">
          🤖 vs AI
        </button>
      </div>

      <!-- Game area -->
      <div class="game-area">
        <!-- LEFT: status + board -->
        <div class="left-col">
          <div class="status" id="status">Player X's turn</div>
          <div class="board">
            <div class="cell" id="c0" onclick="handleClick(0)"></div>
            <div class="cell" id="c1" onclick="handleClick(1)"></div>
            <div class="cell" id="c2" onclick="handleClick(2)"></div>
            <div class="cell" id="c3" onclick="handleClick(3)"></div>
            <div class="cell" id="c4" onclick="handleClick(4)"></div>
            <div class="cell" id="c5" onclick="handleClick(5)"></div>
            <div class="cell" id="c6" onclick="handleClick(6)"></div>
            <div class="cell" id="c7" onclick="handleClick(7)"></div>
            <div class="cell" id="c8" onclick="handleClick(8)"></div>
          </div>
        </div>

        <!-- RIGHT: scores + buttons -->
        <div class="right-col">
          <div class="score-row">
            <div class="score-card">
              <span class="score-label">✕ &nbsp;X Wins</span>
              <span class="score-num" id="score-x">0</span>
            </div>
            <div class="score-card">
              <span class="score-label">🤝 Draws</span>
              <span class="score-num" id="score-d">0</span>
            </div>
            <div class="score-card">
              <span class="score-label">◯ &nbsp;O Wins</span>
              <span class="score-num" id="score-o">0</span>
            </div>
          </div>

          <div class="btn-col">
            <button class="btn btn-primary" onclick="resetGame()">
              ↺ &nbsp;New Game
            </button>
            <button class="btn" onclick="resetScores()">
              🗑 &nbsp;Reset Scores
            </button>
          </div>
        </div>
      </div>
      <!-- /game-area -->
    </div>
    <!-- /page -->
    <script src="script.js"></script>
  </body>
</html>
